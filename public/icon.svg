<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090e0c" />
      <stop offset="50%" stop-color="#121815" />
      <stop offset="100%" stop-color="#04261b" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="emeraldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="paperFold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4" />

  <!-- Geometric Origami / Papercraft Graphic -->
  <g transform="translate(256, 240)" filter="url(#shadow)">
    <!-- Base Paper Sheet 3D isometric plane -->
    <path d="M-130,-40 L0,-115 L130,-40 L0,35 Z" fill="url(#paperFold)" opacity="0.95" />
    
    <!-- Left Paper Fold Flap -->
    <path d="M-130,-40 L0,35 L-70,120 Z" fill="url(#emeraldGrad)" />
    
    <!-- Right Paper Fold Flap -->
    <path d="M130,-40 L0,35 L70,120 Z" fill="url(#emeraldLight)" />
    
    <!-- Origami Center Diamond -->
    <path d="M0,-60 L50,-30 L0,5 L-50,-30 Z" fill="#ffffff" opacity="0.9" />

    <!-- Craft Scissors Cut Lines & Craft fold dashed lines -->
    <path d="M-100,-25 L-30,15" stroke="#047857" stroke-width="3" stroke-dasharray="6,4" />
    <path d="M100,-25 L30,15" stroke="#047857" stroke-width="3" stroke-dasharray="6,4" />
    
    <!-- Center Crystal Sparkle -->
    <path d="M0,-140 L10,-110 L40,-100 L10,-90 L0,-60 L-10,-90 L-40,-100 L-10,-110 Z" fill="#34d399" />
  </g>

  <!-- Title Monogram Badge -->
  <g transform="translate(256, 420)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#121815" stroke="#10b981" stroke-width="2" />
    <text x="0" y="8" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#34d399" letter-spacing="4" text-anchor="middle">KREASIKERTAS</text>
  </g>
</svg>
